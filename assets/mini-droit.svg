<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" width="380" height="150" role="img" aria-label="Droit DPI">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b45309"/><stop offset="1" stop-color="#facc15"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="380" height="150" rx="16"/></clipPath></defs>
<style>.t{font:800 21px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#fff}.s{font:600 12.5px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#cbd5e1}.l{font:500 13px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#e2e8f0}.ic{font:700 22px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#fff}
.go{font:700 11px 'Cascadia Code','Fira Code',Consolas,'Courier New',monospace;fill:#facc15}.shine{animation:sh 5s ease-in-out infinite}@keyframes sh{from{transform:translateX(-400px)}60%,to{transform:translateX(460px)}}</style>
<g clip-path="url(#c)"><rect width="380" height="150" fill="#0b1324"/><circle cx="370" cy="-10" r="110" fill="url(#g)" opacity=".2"/><rect width="380" height="4" fill="url(#g)"/>
<rect x="20" y="22" width="40" height="40" rx="11" fill="url(#g)"/><text x="40" y="50" text-anchor="middle" class="ic">⚖</text>
<text x="72" y="40" class="t">Droit DPI</text><text x="73" y="59" class="s">Intellectual Property Law</text>
<text x="22" y="98" class="l">▸ Summaries · tips · MCQ</text><text x="22" y="128" class="go">OPEN →</text>
<rect class="shine" width="140" height="150" fill="url(#sh)" transform="skewX(-20)"/></g>
<rect x="1" y="1" width="378" height="148" rx="15" fill="none" stroke="#1e2d48" stroke-width="2"/>
</svg>
